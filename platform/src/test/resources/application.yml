# Test configuration: in-memory H2, file system OCFL storage, no Consul, no bus.
articulorum:
  ldp:
    max-rdf-size: 1MB
  storage:
    type: filesystem
    max-upload-size: 5MB
    filesystem:
      root: ./target/test-ocfl
    ocfl:
      work-directory: ./target/test-ocfl-work

management:
  server:
    port: 0
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /.well-known/openapi
  swagger-ui:
    path: /.well-known/swagger-ui.html

spring:
  application:
    name: platform
  cloud:
    bus:
      enabled: false
    consul:
      enabled: false
      config:
        enabled: false
      discovery:
        enabled: false
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
  datasource:
    url: jdbc:h2:mem:articulorum;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: articulorum
    password: articulorum
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  web:
    resources:
      add-mappings: false
