# Locales shipped with Articulorium: one line per locale, in the order the language menu lists them.
#
#   <BCP 47 language tag> = <name of the language in that language>[, rtl]
#
# Every locale listed here needs
#   * ui/src/i18n/<tag>.json                                (the user interface)
#   * src/main/resources/i18n/messages_<tag with _>.properties in every module with messages
#     (i18n/messages.properties) and i18n/common_<tag with _>.properties in this starter
# "npm run i18n:check" (ui) and the MessageBundles tests of each module fail when one is missing
# or lacks keys. The first line is not special: the default locale is articulorium.i18n.default-locale.
en = English
ar = العربية, rtl
de = Deutsch
es = Español
fr = Français
it = Italiano
ja = 日本語
ko = 한국어
nl = Nederlands
pl = Polski
pt-BR = Português (Brasil)
zh-CN = 简体中文
