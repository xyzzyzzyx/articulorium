# Texts shared by every Articulorium service (English, the default locale).
# Every text is a java.text.MessageFormat pattern: write an apostrophe as ''.
# Translations: common_<locale>.properties with exactly the same keys (see the README).

# summaries of HTTP error statuses, used as problem titles and as the fallback of error messages
error.status.400=The request is invalid.
error.status.401=You need to sign in.
error.status.403=You are not allowed to do this.
error.status.404=Nothing was found at this address.
error.status.405=This action is not available here.
error.status.406=No representation in the requested format is available.
error.status.409=The request conflicts with the current state of the resource.
error.status.410=This resource has been deleted.
error.status.412=The resource changed since you loaded it.
error.status.413=The request is too large.
error.status.415=This media type is not supported.
error.status.422=The request could not be processed.
error.status.500=Something went wrong on the server.
error.status.502=A service this one depends on failed.
error.status.503=The service is temporarily unavailable.
error.status.other=The request failed.
