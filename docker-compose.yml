# Articulorium: complete local stack.
#
#   docker compose up --build            start everything (JVM images)
#   docker compose --profile tools up    also start the Kafka UI
#   docker compose --profile e2e run --rm e2e
#                                        run the Cypress end-to-end tests against the stack
#   docker compose -f docker-compose.yml -f docker-compose.native.yml up --build
#                                        use GraalVM native images where supported
#
# Entry points once healthy (allow a minute or two on first start):
#   http://localhost:8000/ui/         Articulorium UI (browse, create, upload, edit, versions, search)
#   http://localhost:8000/discover/   public discovery layer (server-rendered search, collections and
#                                     resource pages with Mirador; DISCOVERY_PUBLIC_URL sets its public
#                                     address, GATEWAY_ROOT_REDIRECT=/discover/ makes it the home page)
#   http://localhost:8000/platform/   LDP root through the gateway
#   http://localhost:8000/swagger-ui.html
#                                     Swagger UI for every service's OpenAPI description
#   http://localhost:8000/auth/       Keycloak, the OpenID Connect provider ("Sign in" in the UI):
#                                     realm "articulorium" with the users curator / curator,
#                                     administrator / administrator and reader / reader; admin
#                                     console http://localhost:8000/auth/admin/ (admin / admin)
#   http://localhost:9001/            LDP root directly on the platform
#   localhost:5432                    PostgreSQL (articulorium / articulorium), the platform database
#   http://localhost:8500/            Consul UI
#   http://localhost:9101/            MinIO console (articulorium / articulorium-secret)
#   http://localhost:8983/            Solr admin
#   http://localhost:7001/            QLever SPARQL endpoint (queries; updates need QLEVER_ACCESS_TOKEN)
#   http://localhost:8000/topology/topologies
#                                     PCDM topologies (topology service)
#   http://localhost:8000/oai?verb=Identify
#                                     OAI-PMH 2.0 data provider (base URL http://localhost:8000/oai)
#   http://localhost:8000/transform/iiif/<path>
#                                     IIIF Presentation 3 manifest / collection of a PCDM resource
#   http://localhost:8000/platform/harvested/
#                                     records harvested from other repositories (harvest service;
#                                     run harvests from the UI's Harvest page, see harvest/README.md)
#   http://localhost:8000/harvest/sources
#                                     harvest API of the user interface
#
# Optional AI agent (Spring AI with a local Ollama model; ai/README.md):
#   docker compose --profile ai up --build
#                                        also start the agent, Ollama and pull its model (several GB
#                                        on first start); the UI then offers topology, metadata and
#                                        topic suggestions. ARTICULORIUM_HARVEST_CLASSIFICATION=true
#                                        also has harvested records classified for review.
#   http://localhost:8000/ai/capabilities
#                                     what the agent offers (the UI hides it without the profile)
#
# Credentials can be overridden with environment variables or an .env file next to this file.
# docker-compose.acl.yml turns on Consul ACLs and accepts Consul tokens as WebAC identities.
# The demo users and passwords of keycloak/articulorium-realm.json are for local use only.

name: articulorium

x-service: &service
  restart: unless-stopped
  networks:
    - cloud
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 40s

# The OpenID Connect issuer as browsers see it (through the gateway) and as services reach it.
# Tokens carry the public issuer; the platform fetches the realm's keys from the internal address.
x-keycloak-env: &keycloak-env
  KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8000/auth}
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
  KEYCLOAK_REALM: articulorium

x-spring-env: &spring-env
  SPRING_CLOUD_CONSUL_HOST: consul
  SPRING_CLOUD_CONSUL_PORT: "8500"
  SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
  JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError

services:

  # ----------------------------------------------------------------------------------------------
  # Articulorium services
  # ----------------------------------------------------------------------------------------------

  gateway:
    <<: *service
    image: articulorium/gateway:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gateway
    environment:
      <<: *spring-env
      # the bare root: the user interface (/ui/) or the discovery layer (/discover/)
      ARTICULORIUM_GATEWAY_ROOT_REDIRECT: ${GATEWAY_ROOT_REDIRECT:-/ui/}
    ports:
      - "8000:9000"
    depends_on:
      consul:
        condition: service_healthy

  platform:
    <<: *service
    image: articulorium/platform:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: platform
    environment:
      <<: [*spring-env, *keycloak-env]
      # access tokens of the Keycloak realm identify WebAC agents (articulorium.webac.oidc.*); the
      # open default root ACL still lets everyone write - for role based access set
      # ARTICULORIUM_WEBAC_ROOT_ACL: classpath:webac/root-acl-oidc.ttl
      ARTICULORIUM_WEBAC_OIDC_ENABLED: "true"
      # PostgreSQL is the platform's default database (see platform application.yml)
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-articulorium}
      POSTGRES_USER: ${POSTGRES_USER:-articulorium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-articulorium}
      # binaries live in an OCFL storage root inside the MinIO bucket
      ARTICULORIUM_STORAGE_TYPE: s3
      ARTICULORIUM_STORAGE_S3_ENDPOINT: http://minio:9000
      ARTICULORIUM_STORAGE_S3_BUCKET: ${ARTICULORIUM_BUCKET:-articulorium}
      ARTICULORIUM_STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-articulorium}
      ARTICULORIUM_STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-articulorium-secret}
    ports:
      - "9001:9000"
    volumes:
      - platform-data:/app/data
    depends_on:
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  transform:
    <<: *service
    image: articulorium/transform:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: transform
    environment:
      <<: *spring-env
    ports:
      - "9002:9000"
    depends_on:
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
      platform:
        condition: service_healthy

  index:
    <<: *service
    image: articulorium/index:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: index
    environment:
      <<: *spring-env
      ARTICULORIUM_SOLR_BASE_URL: http://solr:8983/solr
    ports:
      - "9003:9000"
    depends_on:
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
      solr:
        condition: service_started

  triplestore:
    <<: *service
    image: articulorium/triplestore:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: triplestore
    environment:
      <<: *spring-env
      ARTICULORIUM_TRIPLESTORE_SERVICE_URL: http://qlever:7001
      QLEVER_ACCESS_TOKEN: ${QLEVER_ACCESS_TOKEN:-articulorium-qlever}
    ports:
      - "9004:9000"
    depends_on:
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
      qlever:
        condition: service_healthy

  topology:
    # PCDM topologies (Book, Newspaper, Journal, Postcards, ... and custom ones) and building them
    # in the platform; the gateway serves it under /topology/
    <<: *service
    image: articulorium/topology:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: topology
    environment:
      <<: *spring-env
    ports:
      - "9006:9000"
    depends_on:
      consul:
        condition: service_healthy
      platform:
        condition: service_healthy

  oai:
    # OAI-PMH 2.0 data provider: the repository's metadata (oai_dc) for harvesters, with
    # communities and collections as sets; the gateway serves it at /oai
    <<: *service
    image: articulorium/oai:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: oai
    environment:
      <<: *spring-env
      ARTICULORIUM_OAI_REPOSITORY_NAME: ${OAI_REPOSITORY_NAME:-Articulorium}
      ARTICULORIUM_OAI_ADMIN_EMAILS: ${OAI_ADMIN_EMAIL:-admin@example.org}
    ports:
      - "9007:9000"
    depends_on:
      consul:
        condition: service_healthy
      platform:
        condition: service_healthy

  harvest:
    # Harvests external repositories (Fedora Commons, DSpace, VIVO, any OAI-PMH data provider) into
    # the platform under /harvested. Users with write access to /harvested run harvests from the
    # user interface (Harvest page; API at /harvest on the gateway). Operators can also use the
    # actuator endpoint on its management port (harvest/README.md), e.g.
    #   docker compose exec harvest curl -s localhost:8000/actuator/harvest
    #   docker compose exec harvest curl -s -X POST -H 'Content-Type: application/json' \
    #     -d '{"mode":"full"}' localhost:8000/actuator/harvest/self-oai
    <<: *service
    image: articulorium/harvest:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: harvest
    environment:
      <<: *spring-env
      # the harvester's credentials towards the platform (a fixed Authorization header); the
      # default root ACL lets anyone write, so none are needed locally
      HARVEST_PLATFORM_AUTHORIZATION: ${HARVEST_PLATFORM_AUTHORIZATION:-}
      # classification of harvested records by the AI agent (needs the "ai" profile); records are
      # still harvested as before, suggestions wait in the Harvest page's review queue
      ARTICULORIUM_HARVEST_CLASSIFICATION_ENABLED: ${ARTICULORIUM_HARVEST_CLASSIFICATION:-false}
      # demo sources, harvested on demand only: this repository's own OAI-PMH data provider, and
      # its LDP API (as a Fedora repository) below /harvest-source. Add real sources here or in
      # Consul (config/harvest/articulorium/harvest/sources/...).
      SPRING_APPLICATION_JSON: >-
        {"articulorium": {"harvest": {"sources": {
        "self-oai": {"type": "oai-pmh", "url": "http://oai:9000/"},
        "self-ldp": {"type": "fedora", "url": "http://platform:9000/", "options": {"root": "harvest-source"}}}}}}
    depends_on:
      consul:
        condition: service_healthy
      platform:
        condition: service_healthy
      oai:
        condition: service_healthy

  ai:
    # Optional AI agent (profile "ai"): suggests topologies, metadata of images, videos and PDFs,
    # topics of communities and collections, and the collections of harvested records. It reads
    # the repository with each caller's credentials and never writes: people review and apply.
    # The model runs in the ollama service below, so repository content stays in the deployment;
    # for a hosted or OpenAI-compatible model set ARTICULORIUM_AI_PROVIDER=openai and
    # SPRING_AI_OPENAI_API_KEY / SPRING_AI_OPENAI_BASE_URL / SPRING_AI_OPENAI_CHAT_MODEL (in an .env
    # file, never in source control).
    <<: *service
    profiles:
      - ai
    image: articulorium/ai:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ai
    environment:
      <<: *spring-env
      ARTICULORIUM_AI_ENABLED: "true"
      ARTICULORIUM_AI_PROVIDER: ${ARTICULORIUM_AI_PROVIDER:-ollama}
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      SPRING_AI_OLLAMA_CHAT_MODEL: ${ARTICULORIUM_AI_MODEL:-qwen2.5vl:3b}
    depends_on:
      consul:
        condition: service_healthy
      platform:
        condition: service_healthy
      topology:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully

  ollama:
    # Local model server of the AI agent (profile "ai"); models are kept in a volume
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    profiles:
      - ai
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - cloud

  ollama-model:
    # Pulls the agent's model once (a vision model, so images can be described)
    image: ollama/ollama:0.12.6
    profiles:
      - ai
    entrypoint: ["ollama", "pull", "${ARTICULORIUM_AI_MODEL:-qwen2.5vl:3b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - cloud

  discovery:
    # API of the public discovery layer: the deployment's branding, layouts, facets and search
    # precedence (articulorium.discovery.*, see discovery/README.md), searches of the Solr collection
    # with every hit checked against the platform's WebAC, resource descriptions; the gateway serves
    # it under /discover/api/
    <<: *service
    image: articulorium/discovery:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: discovery
    environment:
      <<: *spring-env
      ARTICULORIUM_DISCOVERY_PUBLIC_URL: ${DISCOVERY_PUBLIC_URL:-http://localhost:8000/discover/}
      ARTICULORIUM_DISCOVERY_SOLR_BASE_URL: http://solr:8983/solr
    ports:
      - "9008:9000"
    depends_on:
      consul:
        condition: service_healthy
      solr:
        condition: service_healthy

  discovery-ui:
    # The public discovery and presentation layer: Angular rendered on the server (Node.js) for
    # search engines and fast first pages, Angular Material themed by the discovery service's
    # settings, Mirador for images, audio, video and PDFs; the gateway serves it under /discover/
    image: articulorium/discovery-ui:latest
    build:
      context: ./discovery-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # the discovery API as this server reaches it (the same path as browsers use)
      DISCOVERY_API_URL: http://gateway:9000/discover/api/
      # host names requests may be addressed to: the gateway forwards Host discovery-ui:4000 and
      # the visitor's host as X-Forwarded-Host (add the public host name in production)
      NG_ALLOWED_HOSTS: ${DISCOVERY_ALLOWED_HOSTS:-localhost,127.0.0.1,discovery-ui,gateway}
    ports:
      - "4000:4000"
    networks:
      - cloud
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      gateway:
        condition: service_healthy

  service:
    # Angular user interface and its support API (agents, media type detection, UI settings);
    # the gateway serves it under /ui/
    <<: *service
    image: articulorium/service:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: service
    environment:
      <<: *spring-env
    ports:
      - "9005:9000"
    depends_on:
      consul:
        condition: service_healthy

  # ----------------------------------------------------------------------------------------------
  # Infrastructure
  # ----------------------------------------------------------------------------------------------

  keycloak:
    # OpenID Connect provider (the default identity provider, swappable: see README.md,
    # "Authentication"). Development mode with an in-container database: the realm of
    # keycloak/articulorium-realm.json is imported on every fresh start. Served under /auth and
    # reached through the gateway, so the issuer is http://localhost:8000/auth/realms/articulorium
    # for browsers and tokens alike while services fetch keys from keycloak:8080 (backchannel).
    image: quay.io/keycloak/keycloak:26.6.3
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8000/auth}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # the gateway sets X-Forwarded-* (and removes any a client sends)
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    networks:
      - cloud
    healthcheck:
      # no curl in the image: ask the management interface with bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    # metadata of every LDP resource (the platform's JPA store) and the OCFL object lock table
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-articulorium}
      POSTGRES_USER: ${POSTGRES_USER:-articulorium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-articulorium}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images keep PGDATA in a version specific directory below this mount
      - postgres-data:/var/lib/postgresql
    networks:
      - cloud
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30

  consul:
    image: hashicorp/consul:1.20
    command: agent -dev -client=0.0.0.0 -ui
    restart: unless-stopped
    ports:
      - "8500:8500"
    networks:
      - cloud
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    # single KRaft node: no ZooKeeper needed for Kafka. The bus only carries change
    # notifications, so the log is kept in the container (not persisted).
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    networks:
      - cloud
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 15s

  minio:
    # S3 compatible object storage holding the OCFL storage root. MinIO stopped publishing
    # images (Docker Hub deleted minio/minio in September 2026), so this runs Silo, the
    # community fork by Pigsty: same MINIO_* settings, command, ports and data format.
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-articulorium}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-articulorium-secret}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    networks:
      - cloud
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  zookeeper:
    # coordination for SolrCloud only
    image: zookeeper:3.9
    restart: unless-stopped
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok,mntr,srvr
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog
    networks:
      - cloud
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 30

  solr:
    image: solr:9.8
    restart: unless-stopped
    environment:
      ZK_HOST: zookeeper:2181
      SOLR_HEAP: 512m
    ports:
      - "8983:8983"
    volumes:
      - solr-data:/var/solr
    networks:
      - cloud
    depends_on:
      zookeeper:
        condition: service_healthy

  qlever:
    # SPARQL store (QLever) holding one named graph per resource; derived data that the
    # triplestore service writes from platform events. triplestore/qlever/entrypoint.sh builds an
    # empty index on first start and runs the server with an access token and persisted updates.
    image: docker.io/adfreiburg/qlever:0.6.0
    entrypoint: ["/bin/bash", "/opt/articulorium-qlever/entrypoint.sh"]
    # the index lives in a named volume; run as root to avoid volume permission problems
    user: "0:0"
    restart: unless-stopped
    environment:
      QLEVER_ACCESS_TOKEN: ${QLEVER_ACCESS_TOKEN:-articulorium-qlever}
      QLEVER_MEMORY: ${QLEVER_MEMORY:-2G}
    ports:
      - "7001:7001"
    volumes:
      - ./triplestore/qlever:/opt/articulorium-qlever:ro
      - qlever-data:/data
    networks:
      - cloud
    healthcheck:
      # no curl in the image: probe the port with bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7001"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # ----------------------------------------------------------------------------------------------
  # Tests
  # ----------------------------------------------------------------------------------------------

  e2e:
    # Cypress end-to-end tests against the running stack (e2e/README.md). Only with the e2e
    # profile: docker compose --profile e2e run --rm e2e
    # The browser runs in this container; e2e/docker/run.sh forwards its localhost:8000 to the
    # gateway, so every URL is the same as in a browser on the host.
    profiles: ["e2e"]
    image: cypress/included:16.1.1
    working_dir: /e2e
    entrypoint: ["bash", "/e2e/docker/run.sh"]
    # room for Chrome's shared memory
    shm_size: 1gb
    environment:
      CYPRESS_CACHE_FOLDER: /root/.cache/Cypress
      # extra arguments for cypress run, e.g. E2E_ARGS="--spec cypress/e2e/search.cy.ts"
      E2E_ARGS: ${E2E_ARGS:-}
      # the browser for cypress run: chrome (default), firefox or electron
      E2E_BROWSER: ${E2E_BROWSER:-chrome}
      # E2E_VIDEO=true records what the browser shows to e2e/cypress/videos
      E2E_VIDEO: ${E2E_VIDEO:-false}
    volumes:
      - ./e2e:/e2e
      # the container's own node_modules, never the host's (other OS)
      - e2e-node-modules:/e2e/node_modules
    depends_on:
      gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      platform:
        condition: service_healthy
      service:
        condition: service_healthy
      topology:
        condition: service_healthy
      transform:
        condition: service_healthy
      oai:
        condition: service_healthy
      # the discovery spec searches the Solr collection the index service writes
      discovery:
        condition: service_healthy
      discovery-ui:
        condition: service_healthy
      # the harvest spec runs harvests on the harvest service's management port
      harvest:
        condition: service_healthy
      # the indexing pipeline spec reads what these write to Solr and QLever
      index:
        condition: service_healthy
      triplestore:
        condition: service_healthy
    networks:
      - cloud

  kafka-ui:
    image: kafbat/kafka-ui:latest
    profiles:
      - tools
    environment:
      KAFKA_CLUSTERS_0_NAME: articulorium
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "9091:8080"
    networks:
      - cloud
    depends_on:
      kafka:
        condition: service_healthy

