# Articulorium gateway: public entry point routing to Consul-registered services.
#
#   /                 redirect to articulorium.gateway.root-redirect (the user interface, /ui/, by default;
#                     /discover/ makes the public discovery layer the home page)
#   /ui               redirect to the user interface (/ui/)
#   /ui/**            service (Angular UI and its API)
#   /platform/**      platform (Linked Data Platform root)
#   /transform/**     transform (transformer preview API, IIIF Presentation exports)
#   /topology/**      topology (PCDM topologies and their instantiation)
#   /auth/**          the OpenID Connect provider (Keycloak in docker compose; not in Consul)
#   /oai              oai (OAI-PMH 2.0 data provider; the repository's base URL)
#   /harvest/**       harvest (sources, harvests and reports for the user interface)
#   /ai/**            ai (optional AI agent: suggestions of topologies, metadata, topics, classifications)
#   /discover/api/**  discovery (configuration, search and resources of the public discovery layer)
#   /discover/**      discovery-ui (server-rendered discovery and presentation pages; Node.js, not in Consul)
#   /swagger-ui.html  Swagger UI for the OpenAPI descriptions of every service above

logging:
  level:
    root: INFO

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  server:
    port: 8000

server:
  port: 9000

springdoc:
  # the gateway has no API of its own: its Swagger UI lists the routed services' descriptions
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: platform
    urls:
      - name: platform
        url: /platform/.well-known/openapi
      - name: transform
        url: /transform/v3/api-docs
      - name: topology
        url: /topology/v3/api-docs
      - name: oai
        url: /oai/v3/api-docs
      - name: ai
        url: /ai/v3/api-docs
      - name: discovery
        url: /discover/api/docs
      - name: service
        url: /ui/api/docs

spring:
  application:
    name: gateway

  config:
    import: "optional:consul:"

  cloud:
    consul:
      host: consul
      port: 8500
      config:
        enabled: true
        fail-fast: false
      discovery:
        health-check-url: http://${spring.cloud.client.ip-address}:${management.server.port}/actuator/health
        health-check-interval: 15s
        instance-id: ${spring.application.name}:${random.value}
        service-name: articulorium-${spring.application.name}
        prefer-ip-address: true

    gateway:
      server:
        webflux:
          # Services mint absolute URLs (resource IRIs, Location headers, OpenAPI servers) from
          # X-Forwarded-Host/-Port/-Proto/-Prefix. Spring Cloud Gateway only writes those for
          # clients matching trusted-proxies, strips them otherwise (CVE-2025-41235), and appends
          # to whatever a trusted client sent. So: every client is "trusted", and the default
          # filters below first drop any forwarded headers clients send themselves (gateway filters
          # run before the header filters), so the gateway's own values are the only ones and
          # nobody can choose the host IRIs are minted under. X-Forwarded-Prefix comes from the
          # path StripPrefix removes. Behind a TLS-terminating proxy, stop removing
          # X-Forwarded-Proto/-Host here and restrict trusted-proxies to that proxy's address.
          trusted-proxies: '.*'
          default-filters:
            - RemoveRequestHeader=Forwarded
            - RemoveRequestHeader=X-Forwarded-For
            - RemoveRequestHeader=X-Forwarded-Host
            - RemoveRequestHeader=X-Forwarded-Port
            - RemoveRequestHeader=X-Forwarded-Proto
            - RemoveRequestHeader=X-Forwarded-Prefix
          routes:
            - id: articulorium-platform
              uri: lb://articulorium-platform
              predicates:
                - Path=/platform,/platform/**
              filters:
                - StripPrefix=1
            - id: articulorium-transform
              uri: lb://articulorium-transform
              predicates:
                - Path=/transform,/transform/**
              filters:
                - StripPrefix=1
            - id: articulorium-topology
              uri: lb://articulorium-topology
              predicates:
                - Path=/topology,/topology/**
              filters:
                - StripPrefix=1
            # The identity provider shares the gateway's origin: browsers reach the login pages, the
            # token endpoint and the issuer identifier (http://localhost:8000/auth/realms/...) at the
            # same address as the user interface. Keycloak runs with http-relative-path /auth, so
            # the path is forwarded unchanged. Point it elsewhere with ARTICULORIUM_GATEWAY_AUTH_URI.
            - id: articulorium-auth
              uri: ${articulorium.gateway.auth-uri:http://keycloak:8080}
              predicates:
                - Path=/auth,/auth/**
            # OAI-PMH base URL: http://<gateway>/oai (StripPrefix turns /oai into the service's /)
            - id: articulorium-oai
              uri: lb://articulorium-oai
              predicates:
                - Path=/oai,/oai/**
              filters:
                - StripPrefix=1
            # harvest API of the user interface; access is checked against the platform's WebAC
            - id: articulorium-harvest
              uri: lb://articulorium-harvest
              predicates:
                - Path=/harvest/**
              filters:
                - StripPrefix=1
            # optional AI agent (suggestions reviewed before they are applied); the agent checks the
            # caller's access against the platform's WebAC. Without the ai service the route
            # answers 503 and the user interface hides the AI actions
            - id: articulorium-ai
              uri: lb://articulorium-ai
              predicates:
                - Path=/ai/**
              filters:
                - StripPrefix=1
            # API of the public discovery layer: /discover/api/** -> the discovery service's /api/**
            # (its OpenAPI description is /discover/api/docs). Declared before the pages' route.
            - id: articulorium-discovery-api
              uri: lb://articulorium-discovery
              predicates:
                - Path=/discover/api/**
              filters:
                - StripPrefix=1
            # the server-rendered discovery and presentation pages (Angular SSR on Node.js, which is
            # not registered in Consul): forwarded unchanged, the application's base href is
            # /discover/. Point it elsewhere with ARTICULORIUM_GATEWAY_DISCOVERY_URI.
            - id: articulorium-discovery-slash
              uri: no://op
              predicates:
                - Path=/discover
              filters:
                - RedirectTo=302, /discover/
            - id: articulorium-discovery
              uri: ${articulorium.gateway.discovery-uri:http://discovery-ui:4000}
              predicates:
                - Path=/discover/**
            # /ui is redirected here (relative to the gateway's address): the service's own
            # context-root redirect would point browsers at the service's internal address
            - id: articulorium-ui-slash
              uri: no://op
              predicates:
                - Path=/ui
              filters:
                - RedirectTo=302, /ui/
            # the service runs under the /ui context path itself: forward the path unchanged
            - id: articulorium-service
              uri: lb://articulorium-service
              predicates:
                - Path=/ui/**
            # the bare root opens the user interface, or the discovery layer with
            # ARTICULORIUM_GATEWAY_ROOT_REDIRECT=/discover/
            - id: articulorium-root
              uri: no://op
              predicates:
                - Path=/
              filters:
                - RedirectTo=302, ${articulorium.gateway.root-redirect:/ui/}
