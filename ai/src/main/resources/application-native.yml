# Settings applied when the service is built as (and runs as) a GraalVM native image.
# Spring Cloud's refresh scope relies on runtime bean re-creation, which AOT does not support.
spring:
  cloud:
    refresh:
      enabled: false
    # Spring Cloud LoadBalancer keeps one child context per service id. AOT can only prepare the
    # contexts it knows of while the image is built: any other id fails on its first request
    # ("GenericApplicationContext must be an instance of AnnotationConfigRegistry"). List every
    # Consul service the agent calls (articulorium.ai.platform-url, .topology-url).
    loadbalancer:
      eager-load:
        clients:
          - articulorium-platform
          - articulorium-topology
    consul:
      config:
        watch:
          enabled: false

  # Spring AOT decides which beans exist when the image is built, so the chat model provider is
  # fixed then: an image built without one has no chat model whatever ARTICULORIUM_AI_PROVIDER says
  # when it runs. The native image is therefore built for Ollama, the deployment's provider; set
  # ARTICULORIUM_AI_PROVIDER while building for another one.
  ai:
    model:
      chat: ${ARTICULORIUM_AI_PROVIDER:ollama}
