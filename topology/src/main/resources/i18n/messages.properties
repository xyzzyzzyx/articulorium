# Texts of the topology service (English, the default locale); see i18n-spring-boot-starter.
# Every text is a java.text.MessageFormat pattern: write an apostrophe as ''.

# error responses (TopologyExceptionHandler)
problem.invalid=Invalid topology request
problem.not-found=No topology {0}

# built-in topologies (classpath:topologies/*.json): names and descriptions by topology id
topology.audiovisual.name=Audiovisual recording
topology.audiovisual.description=An audio or video recording of one or more parts (sides, reels, tracks) with preservation and access files.
topology.book.name=Book
topology.book.description=A monograph: a book object with ordered pages, each with master and access images and OCR text.
topology.journal.name=Journal
topology.journal.description=A scholarly journal (collection) of volumes, issues and articles; articles hold their PDF and supplementary files.
topology.manuscript.name=Manuscript
topology.manuscript.description=A manuscript or archival volume of folios, each with recto and verso images.
topology.newspaper.name=Newspaper
topology.newspaper.description=A newspaper title (collection) with issues, each issue an object of ordered pages.
topology.postcards.name=Postcards
topology.postcards.description=A postcard collection; each postcard has a front and a back image.

