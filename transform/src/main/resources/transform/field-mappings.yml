# Field mappings of the "field-mapping" transformer: how an LDP resource becomes a search document.
#
# Ported from the Apache Marmotta LDPath program (default.ldpath) the transform service used before.
# Each field lists property paths (alternatives are combined, like LDPath's "|"; a path of several
# steps is written "a:p / b:q") and a type: string, uri, dateTime, integer, decimal or boolean.
# The document identifier ("id") is always the resource IRI and is not configured here.
#
# Point articulorum.transform.field-mappings at another file (file:/config/fields.yml) to change it.

prefixes:
  fedora: "http://fedora.info/definitions/v4/repository#"
  pcdm: "http://pcdm.org/models#"
  ore: "http://www.openarchives.org/ore/terms/"
  iana: "http://www.iana.org/assignments/relation/"
  acl: "http://www.w3.org/ns/auth/acl#"
  dcterms: "http://purl.org/dc/terms/"
  rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  owl: "http://www.w3.org/2002/07/owl#"
  skos: "http://www.w3.org/2004/02/skos/core#"
  dc: "http://purl.org/dc/elements/1.1/"

