# Articulorum transform: turns LDP resources into search documents with pluggable transformers.

articulorum:
  transform:
    # transformers run for every resource change, in order (beans implementing spi.Transformer)
    transformers:
      - field-mapping
    # field definitions of the field-mapping transformer
    field-mappings: classpath:transform/field-mappings.yml
    # optional: mint document identifiers under this base instead of the one the platform reports
    base-uri:

logging:
  level:
    root: INFO

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops,loggers
  info:
    env:
      enabled: true
  server:
    port: 8000

info:
  application:
    name: ${spring.application.name}
    description: Transformation of LDP resources into search documents

server:
  port: 9000
  # honour X-Forwarded-* set by the gateway (server URLs of the OpenAPI description)
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

spring:
  application:
    name: transform

  config:
    import: "optional:consul:"

  cloud:
    bus:
      destination: resource-bus
      ack:
        enabled: false

    consul:
      host: consul
      port: 8500
      config:
        enabled: true
        fail-fast: false
      discovery:
        health-check-url: http://${spring.cloud.client.ip-address}:${management.server.port}/actuator/health
        health-check-interval: 15s
        instance-id: ${spring.application.name}:${random.value}
        service-name: articulorum-${spring.application.name}
        prefer-ip-address: true

    stream:
      kafka:
        binder:
          brokers: kafka:9092
          auto-add-partitions: true
      bindings:
        springCloudBusInput:
          destination: resource-bus
        springCloudBusOutput:
          destination: document-bus
          producer:
            partition-count: 3
