# Articulorium transform: turns LDP resources into search documents with pluggable transformers.

articulorium:
  transform:
    # transformers run for every resource change, in order (beans implementing spi.Transformer)
    transformers:
      - field-mapping
    # field definitions of the field-mapping transformer
    field-mappings: classpath:transform/field-mappings.yml
    # optional: mint document identifiers under this base instead of the one the platform reports
    base-uri:
  iiif:
    # IIIF Presentation 3.0 export (GET /iiif/<path>): where this service reads the platform
    platform-url: http://articulorium-platform/
    load-balanced: true
    # where clients reach the platform and the UI, relative to this service's public base
    # (the gateway serves it under /transform/) or absolute
    platform-public-url: ../platform/
    ui-public-url: ../ui/
    # read image dimensions from the first bytes of each image (JPEG, PNG, GIF, BMP, TIFF)
    probe-image-size: true
    probe-bytes: 262144
    default-width: 1000
    default-height: 1000
    max-resources: 2000
    # paint the PDF of a canvas that has no image, audio or video (a Text body), so viewers that
    # present documents (the discovery layer's Mirador) show it; otherwise it is a rendering only
    paint-documents: true

logging:
  level:
    root: INFO

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops,loggers,integrationgraph
  info:
    env:
      enabled: true
  server:
    port: 8000

info:
  application:
    name: ${spring.application.name}
    description: Transformation of LDP resources into search documents and IIIF exports

server:
  port: 9000
  # honour X-Forwarded-* set by the gateway (server URLs of the OpenAPI description)
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

spring:
  application:
    name: transform

  config:
    import: "optional:consul:"

  cloud:
    bus:
      destination: resource-bus
      ack:
        enabled: false

    consul:
      host: consul
      port: 8500
      config:
        enabled: true
        fail-fast: false
      discovery:
        health-check-url: http://${spring.cloud.client.ip-address}:${management.server.port}/actuator/health
        health-check-interval: 15s
        instance-id: ${spring.application.name}:${random.value}
        service-name: articulorium-${spring.application.name}
        prefer-ip-address: true

    stream:
      kafka:
        binder:
          brokers: kafka:9092
          auto-add-partitions: true
          # every bus topic has 3 partitions from the first binding on, whichever service binds
          # first: a consumer that subscribed to a 1-partition topic would only see partitions added
          # later by a producer after its next metadata refresh (5 minutes) and miss their events
          min-partition-count: 3
      bindings:
        springCloudBusInput:
          destination: resource-bus
        springCloudBusOutput:
          destination: document-bus
          producer:
            partition-count: 3
