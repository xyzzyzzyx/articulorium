# Articulorium index: search index (Solr or Elasticsearch) synchronisation of transformed resources.

articulorium:
  index:
    # the search index documents are written to: solr or elasticsearch. The discovery service must
    # read the same one (articulorium.discovery.index.backend). See README.md, "Search index".
    backend: solr

  solr:
    base-url: http://solr:8983/solr
    collection: articulorium
    num-shards: 1
    replication-factor: 1
    config-set: _default
    commit-within: 1000
    # declared on start-up when missing (the _default config set creates fields only when a
    # document carries them): the discovery layer sorts and facets on these
    fields:
      created: pdate
      "[lastModified]": pdate
      date: pdates

  # used with articulorium.index.backend: elasticsearch
  elasticsearch:
    base-url: http://elasticsearch:9200
    index: articulorium
    # credentials, when the cluster asks for them: an API key (the Base64 "encoded" value), or a
    # user and password (set them with ARTICULORIUM_ELASTICSEARCH_API_KEY or ..._USERNAME and
    # ..._PASSWORD rather than in a file)
    # api-key:
    # username:
    # password:
    # of an index created on start-up (number-of-replicas: 0 on a single node)
    number-of-shards: 1
    number-of-replicas: 1
    refresh-interval: 1s
    # declared on start-up when missing: every other field is mapped as text when its first
    # document is indexed, and the discovery layer sorts on these and builds year facets from them
    fields:
      created: date
      "[lastModified]": date
      date: date

logging:
  level:
    root: INFO

management:
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,integrationgraph
  info:
    env:
      enabled: true
    java:
      enabled: true
  server:
    port: 8000

info:
  application:
    name: ${spring.application.name}
    description: Indexing of search documents in Solr or Elasticsearch

server:
  port: 9000

spring:
  application:
    name: index

  config:
    import: "optional:consul:"

  cloud:
    bus:
      destination: document-bus
      ack:
        enabled: false

    consul:
      host: consul
      port: 8500
      config:
        enabled: true
        fail-fast: false
      discovery:
        health-check-url: http://${spring.cloud.client.ip-address}:${management.server.port}/actuator/health
        health-check-interval: 15s
        instance-id: ${spring.application.name}:${random.value}
        service-name: articulorium-${spring.application.name}
        prefer-ip-address: true

    stream:
      kafka:
        binder:
          brokers: kafka:9092
          auto-add-partitions: true
          # every bus topic has 3 partitions from the first binding on, whichever service binds
          # first: a consumer that subscribed to a 1-partition topic would only see partitions added
          # later by a producer after its next metadata refresh (5 minutes) and miss their events
          min-partition-count: 3
      bindings:
        springCloudBusInput:
          destination: document-bus
