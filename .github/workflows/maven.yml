# Builds and tests every module (JVM unit and integration tests, Angular unit tests), checks that
# the gateway compiles to a GraalVM native image, then starts the docker compose stack and runs the
# Cypress end-to-end tests against it (the e2e compose service).

name: maven_build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build and run the unit tests
        run: mvn -B -ntp verify

  native:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Native image (gateway)
        run: mvn -B -ntp -Pnative -pl gateway -am package -DskipTests

  compose:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        # the first start also pulls the AI agent's model (several GB)
        run: docker compose up --build -d --wait --wait-timeout 1800
      - name: Smoke test the LDP root through the gateway
        run: |
          curl -fsS -H 'Accept: text/turtle' http://localhost:8000/platform/
          curl -fsS -X POST -H 'Slug: smoke' -H 'Content-Type: text/plain' --data 'hello' http://localhost:8000/platform/
          curl -fsS http://localhost:8000/platform/smoke | grep -q hello
          # resources are minted under the gateway's address (forwarded headers reach the platform)
          curl -fsS -D - -o /dev/null -X POST -H 'Content-Type: text/plain' --data 'x' http://localhost:8000/platform/ \
            | grep -i '^location: http://localhost:8000/platform/' 
      - name: Smoke test health, OpenAPI and the UI
        run: |
          curl -fsS http://localhost:9001/.well-known/openapi | grep -q openapi
          curl -fsS http://localhost:8000/swagger-ui.html -o /dev/null -w "%{http_code}" | grep -qE "200|302"
          curl -fsS http://localhost:8000/ui/ | grep -q '<ui-root'
          curl -fsS http://localhost:8000/ui/api/agents | grep -q '"owl"'
          docker compose exec -T platform curl -fsS http://localhost:8000/actuator/health | grep -q '"db"' 
      - name: Smoke test topologies, communities, access control, notifications, IIIF, OAI-PMH, harvesting and QLever
        run: |
          curl -fsS http://localhost:8000/topology/topologies | grep -q '"book"'
          curl -fsS -H 'Accept: application/n-triples' http://localhost:8000/platform/communities | grep -q CommunityRoot
          curl -fsS 'http://localhost:8000/platform/.well-known/webac?resource=communities' | grep -q '"userModes"'
          curl -fsS -H 'Accept: application/json' http://localhost:8000/platform/communities/fcr:inbox | grep -q '"notifications"'
          curl -fsS http://localhost:8000/transform/iiif/communities | grep -q '"Collection"'
          curl -fsS 'http://localhost:8000/oai?verb=Identify' | grep -q '<baseURL>http://localhost:8000/oai</baseURL>'
          curl -fsS 'http://localhost:8000/oai?verb=ListMetadataFormats' | grep -q '<metadataPrefix>oai_dc</metadataPrefix>'
          docker compose exec -T harvest curl -fsS http://localhost:8000/actuator/harvest | grep -q '"self-oai"'
          docker compose exec -T harvest curl -fsS http://localhost:8000/actuator/harvest | grep -q '"arxiv"'
          curl -fsS http://localhost:8000/ai/capabilities | grep -q '"model":true'
          docker compose exec -T triplestore curl -fsS http://localhost:8000/actuator/health | grep -q '"qlever"' 
      - name: Smoke test the identity provider (Keycloak on the gateway) and token validation
        run: |
          curl -fsS http://localhost:8000/auth/realms/articulorium/.well-known/openid-configuration \
            | grep -q '"issuer":"http://localhost:8000/auth/realms/articulorium"'
          # a JWT the realm did not sign is rejected
          curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ4In0.c2ln' \
            http://localhost:8000/platform/ | grep -q 401
      - name: End-to-end tests (Cypress, e2e compose service)
        run: docker compose --profile e2e run --rm e2e
      - name: End-to-end screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/cypress/screenshots
          if-no-files-found: ignore
      - name: Logs
        if: always()
        run: docker compose logs --no-color | tail -n 400
      - name: Stop the stack
        if: always()
        run: docker compose down -v
