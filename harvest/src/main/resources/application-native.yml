# Settings applied when the service is built as (and runs as) a GraalVM native image.
# Spring Cloud's refresh scope relies on runtime bean re-creation, which AOT does not support.
spring:
  cloud:
    refresh:
      enabled: false
    # Spring Cloud LoadBalancer keeps one child context per service id. AOT can only prepare the
    # contexts it knows of while the image is built: any other id fails on its first request
    # ("GenericApplicationContext must be an instance of AnnotationConfigRegistry"). List every
    # Consul service the service calls (the platform-url, and the classification's ai-url and topology-url).
    loadbalancer:
      eager-load:
        clients:
          - articulorium-platform
          - articulorium-ai
          - articulorium-topology
    consul:
      config:
        watch:
          enabled: false

# Spring AOT decides which beans exist when the image is built, so whether harvested records are
# classified by the AI agent is fixed then. The native image is built with classification, as the
# compose stack runs it; set ARTICULORIUM_HARVEST_CLASSIFICATION_ENABLED=false while building for an
# image without it.
articulorium:
  harvest:
    classification:
      enabled: ${ARTICULORIUM_HARVEST_CLASSIFICATION_ENABLED:true}
