# Articulorum triplestore: SPARQL store synchronisation of LDP resources.

articulorum:
  triplestore:
    # Blazegraph service root; the SPARQL endpoint is <service-url>/namespace/<namespace>/sparql
    service-url: http://blazegraph:8080/bigdata
    namespace: articulorum
    create-namespace: true
    # when set, resource IRIs are minted under this base instead of the one the client used
    base-uri:

logging:
  level:
    root: INFO

management:
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  info:
    env:
      enabled: true
    java:
      enabled: true
  server:
    port: 8000

info:
  application:
    name: ${spring.application.name}
    description: SPARQL store synchronisation of LDP resources

server:
  port: 9000

spring:
  application:
    name: triplestore

  config:
    import: "optional:consul:"

  cloud:
    bus:
      destination: resource-bus
      ack:
        enabled: false

    consul:
      host: consul
      port: 8500
      config:
        enabled: true
        fail-fast: false
      discovery:
        health-check-url: http://${spring.cloud.client.ip-address}:${management.server.port}/actuator/health
        health-check-interval: 15s
        instance-id: ${spring.application.name}:${random.value}
        service-name: articulorum-${spring.application.name}
        prefer-ip-address: true

    stream:
      kafka:
        binder:
          brokers: kafka:9092
          auto-add-partitions: true
      bindings:
        springCloudBusInput:
          destination: resource-bus
